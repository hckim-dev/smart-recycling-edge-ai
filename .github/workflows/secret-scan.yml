name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked files and new commits
        shell: bash
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/secret-scan-tree"
          mkdir -p "$snapshot"
          git archive HEAD | tar -x -C "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir "$snapshot" --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --max-archive-depth=3 --no-banner
          if [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$SCAN_BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null; then
            "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="$SCAN_BASE..HEAD" --redact=100 --ignore-gitleaks-allow --no-banner
          else
            "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--max-count=1 HEAD" --redact=100 --ignore-gitleaks-allow --no-banner
          fi
